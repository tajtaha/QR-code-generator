<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create QR codes instantly for links, text, and more. Fast, free, and easy QR code generator with downloadable high-quality results."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="stylesheet" href="./output.css" />

    <title>QR code generator | devChallenges.io</title>

    <style>
      body {
        font-family: outfit, sans-serif;
      }
    </style>
  </head>
  <body
    class="flex flex-col items-center justify-center bg-[url('resources/qa-bg.jpg')] h-screen bg-cover bg-center text-white"
  >
    <header class="" id="header">
      <img
        src="resources/Logo.svg"
        alt="Logo"
        id="logo-image"
        class=""
        fetchpriority="high"
        width="200"
        height="100"
      />
    </header>
    <main class="mt-10 w-full max-w-2xl px-4" id="main-parent">
      <div id="first-page" class="">
        <div
          id="first-main-div"
          class="flex justify-between items-center bg-[#030616] border-2 rounded-[20px] border-[#263FA9] h-16 w-full"
        >
          <input
            type="text"
            placeholder="Enter an url"
            id="qrcode-input"
            class="flex-1 placeholder-white pl-6 mr-3 ml-3 focus:outline-none h-10"
          />

          <button
            id="clear-button"
            class="cursor-pointer w-7 h-7 bg-transparent mr-1 hidden"
          >
            <img src="resources/remove.svg" alt="remove logo" class="w-4 h-4" />
          </button>

          <button
            id="create-button"
            class="cursor-pointer mr-1.25 bg-[#263FA9] rounded-xl hover:bg-[#375bf5] h-13 w-40"
          >
            QR code
          </button>
        </div>
        <button
          id="reader-page-button"
          class="cursor-pointer mt-5 absolute top-[60%] left-[47%]"
        >
          <u>Read QRCode</u>
        </button>
      </div>

      <div id="second-page" class="hidden">
        <button
          id="open-settings-button"
          class="cursor-pointer rounded-bl-md rounded-tl-md w-5 h-12 bg-gray-400 hover:bg-gray-500 fixed right-0 top-1/2 transform -translate-y-1/2"
        >
          ◀
        </button>
        <div
          id="settings-div"
          class="h-screen max-h-screen w-full sm:w-1/2 lg:w-1/3 bg-gray-800 fixed right-0 top-0 translate-x-full text-center overflow-y-auto overscroll-contain pb-6"
        >
          <h2 class="text-3xl mt-5 mb-5">Customize your QrCode</h2>
          <hr class="mb-5" />
          <button
            id="close-settings-button"
            class="cursor-pointer rounded-md w-8 h-8 bg-gray-400 hover:bg-gray-500 absolute top-3 right-3 flex items-center justify-center"
          >
            ▶
          </button>

          <h3 class="">Presets</h3>

          <div class="">
            <div class="grid grid-cols-3 gap-3 mb-5">
              <button
                data-type="gradient"
                class="preset-button"
                data-c1="#6a5cff"
                data-c2="#00ffd5"
              >
                <img src="resources/QRCode.png" alt="QRCode image" />
              </button>
              <button
                data-type="gradient"
                class="preset-button"
                data-c1="#ff512f"
                data-c2="#dd2476"
              >
                <img src="resources/QRCode(1).webp" alt="QRCode image" />
              </button>
              <button
                data-type="gradient"
                class="preset-button"
                data-c1="#11998e"
                data-c2="#38ef7d"
              >
                <img src="resources/QRCode(2).webp" alt="QRCode image" />
              </button>
              <button data-type="solid" class="preset-button" data-c1="#000000">
                <img src="resources/QRCode(3).webp" alt="QRCode image" />
              </button>
              <button data-type="solid" class="preset-button" data-c1="#ffffff">
                <img src="resources/QRCode(4).webp" alt="QRCode image" />
              </button>
              <button data-type="solid" class="preset-button" data-c1="#dddddd">
                <img src="resources/QRCode.webp" alt="QRCode image" />
              </button>
            </div>

            <hr class="mb-3 mt-5" />

            <h3>Solid Color</h3>
            <div
              class="m-3 mx-auto bg-[#030616] border-2 border-[#263AF9] rounded-xl justify-between items-center flex w-[80%] pl-5 pr-1.5"
            >
              <input
                type="text"
                class="focus:outline-none h-8 pl-3"
                placeholder="Enter Hex: #000000"
                id="solid-color-input"
                maxlength="7"
              />
              <input
                type="color"
                class="w-7 h-7 m-2"
                id="solid-color-palette"
                value="#263AF9"
              />

              <button
                id="solid-color-apply-button"
                class="cursor-pointer rounded-md bg-[#263FA9] hover:bg-[#375bf5] w-20 h-8"
              >
                Apply
              </button>
            </div>
            <h3 class="mb-3">Gradient Color</h3>

            <div class="m-2 grid grid-rows-2 place-items-center gap-4">
              <div class="rounded-xl w-[80%]">
                <input
                  type="text"
                  class="focus:outline-none mr-5"
                  placeholder="Enter Hex: #000000"
                  id="gradient-color-1-input"
                  maxlength="7"
                />
                <input
                  type="color"
                  class="w-7 h-7"
                  id="gradient-color-1-palette"
                  value="#263AF9"
                />
              </div>

              <div class="rounded-xl w-[80%]">
                <input
                  type="text"
                  class="focus:outline-none mr-5"
                  placeholder="Enter Hex: #000000"
                  id="gradient-color-2-input"
                  maxlength="7"
                />
                <input
                  type="color"
                  class="w-7 h-7"
                  id="gradient-color-2-palette"
                  value="#263AF9"
                />
              </div>

              <button
                id="gradient-color-apply-button"
                class="cursor-pointer rounded-md bg-[#263FA9] hover:bg-[#375bf5] w-20 h-8"
              >
                Apply
              </button>
            </div>

            <hr class="mb-5 mt-5" />

            <input
              id="logo-upload"
              type="file"
              accept="image/*"
              class="hidden"
            />

            <button
              id="upload-logo-button"
              class="cursor-pointer w-20 h-10 bg-gray-400 hover:bg-gray-300"
            >
              Upload logo
            </button>

            <button
              id="opacity-button"
              class="cursor-pointer w-20 h-10 bg-gray-400 hover:bg-gray-300"
            >
              blur
            </button>

            <button
              id="remove-image-button"
              class="cursor-pointer w-20 h-10 bg-gray-400 hover:bg-gray-300"
            >
              Remove the Image
            </button>

            <input
              type="text"
              id="qr-text"
              placeholder="Text on QR code"
              maxlength="16"
            />
          </div>
        </div>
        <div
          class="flex justify-center items-center h-80 w-80 bg-[#F8FAFC1A] rounded-full ml-8"
        >
          <canvas
            id="qr-canvas"
            width="240"
            height="240"
            class="rounded-2xl"
          ></canvas>

          <canvas id="qr-mask" width="240" height="240" class="hidden"></canvas>
        </div>

        <div class="mt-8 flex items-center">
          <button
            id="download-button"
            class="cursor-pointer flex items-center bg-[#263FA9] w-45 h-13 mr-1.75 rounded-xl pl-10 gap-3 hover:bg-[#375bf5] transition-all duration-200 ease-in-out hover:scale-105 hover:shadow-lg"
          >
            Download
            <img
              src="resources/Load_circle_duotone.svg"
              alt="download icon"
              class=""
            />
          </button>
          <button
            id="share-button"
            class="cursor-pointer flex items-center bg-[#263FA9] w-40 h-13 mr-1.75 rounded-xl ml-5 pl-10 gap-3 hover:bg-[#375bf5] transition-all duration-200 ease-in-out hover:scale-105 hover:shadow-lg"
          >
            Share <img src="resources/link_alt.svg" alt="share icon" />
          </button>
        </div>
        <button
          id="back-button"
          class="cursor-pointer flex items-center justify-center bg-gray-600 hover:bg-gray-500 w-24 h-10 mt-6 ml-36 rounded-xl gap-3 transition-all duration-200 ease-in-out hover:scale-105 hover:shadow-lg"
        >
          Back
          <img
            src="resources/left-chevron.svg"
            alt="back icon"
            class="w-4 h-4"
          />
        </button>
      </div>

      <div
        id="third-page"
        class="hidden flex items-center justify-center flex-col gap-5"
      >
        <input
          type="file"
          id="reader-upload-input"
          accept="image/*"
          class="hidden"
        />

        <canvas id="reader-canvas"></canvas>

        <p id="reader-result" class=""></p>

        <button
          id="read-qrcode-button"
          class="cursor-pointer bg-[#263FA9] rounded-xl hover:bg-[#375bf5] h-13 w-40"
        >
          Upload Image
        </button>

        <button id="create-qrcode-button" class="cursor-pointer">
          <u>Create QRCode</u>
        </button>
      </div>
    </main>

    <script src="qrcode.min.js"></script>
    <script src="jsQR.js"></script>

    <script src="script.js"></script>
  </body>
</html>
