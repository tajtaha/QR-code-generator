<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="stylesheet" href="./output.css" />

    <title>QR code generator | devChallenges.io</title>

    <style>
      body {
        font-family: outfit, sans-serif;
      }
    </style>
  </head>
  <body
    class="flex flex-col items-center justify-center bg-[url('resources/qa-bg.jpg')] h-screen bg-cover bg-center"
  >
    <header class="" id="header">
      <img src="resources/Logo.svg" alt="Logo" id="logo-image" class="" />
    </header>
    <main class="mt-10">
      <div id="first-page" class="">
        <div
          id="first-main-div"
          class="flex justify-between items-center bg-[#030616] border-2 rounded-[20px] border-[#263FA9] w-165 h-17"
        >
          <input
            type="url"
            placeholder="Enter an url"
            id="input"
            class="text-white placeholder-white w-130 h-10 ml-7 mr-3 focus:outline-none"
          />
          <button
            id="create-button"
            class="cursor-pointer text-white w-35 h-13 mr-1.75 bg-[#263FA9] rounded-xl hover:bg-[#375bf5]"
          >
            QR code
          </button>
        </div>
      </div>

      <div id="second-page" class="hidden">
        <div
          class="flex justify-center items-center h-80 w-80 bg-[#F8FAFC1A] rounded-full ml-8"
        >
          <img id="qr-image" alt="QR Code" class="rounded-2xl" />
        </div>
        <div class="mt-8 flex items-center">
          <button
            id="download-button"
            class="cursor-pointer flex items-center bg-[#263FA9] text-white w-45 h-13 mr-1.75 rounded-xl pl-10 gap-3 hover:bg-[#375bf5] transition-all duration-200 ease-in-out hover:scale-105 hover:shadow-lg"
          >
            Download
            <img
              src="resources/Load_circle_duotone.svg"
              alt="download logo"
              class=""
            />
          </button>
          <button
            id="share-button"
            class="cursor-pointer flex items-center bg-[#263FA9] text-white w-40 h-13 mr-1.75 rounded-xl ml-5 pl-10 gap-3 hover:bg-[#375bf5] transition-all duration-200 ease-in-out hover:scale-105 hover:shadow-lg"
          >
            Share <img src="resources/link_alt.svg" alt="share logo" />
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
